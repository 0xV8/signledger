[build-system]
# Lower bound: PEP 639 (`license` as an SPDX string + `license-files`) needs 77.
# Upper bound: a build backend is the one dependency that can change what is INSIDE the
# artifact without any source change. This project already shipped a release whose wheel
# omitted a required migration; an unbounded backend is that risk on someone else's
# schedule. Raise it deliberately, with a wheel-diff, not implicitly.
requires = ["setuptools>=77,<84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signledger"
dynamic = ["version"]
description = "Tamper-evident append-only audit logging with verified signatures and external anchoring"
readme = "README.md"
requires-python = ">=3.9"
# PEP 639. The TOML-table spelling and the License classifier below are both deprecated
# with a stated removal date of 2027-Feb-18.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipin Kumar", email = "vipin@buffercode.in" }]
keywords = ["audit", "logging", "immutable", "ledger", "tamper-evident", "cryptography", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: Security :: Cryptography",
    "Topic :: Database",
    # The version list is checked against `requires-python` by
    # tests/test_packaging.py::TestDeclaredPythonSupport. It silently drifted a release
    # behind once (it stopped at 3.13 while 3.14 was released and verified end to end),
    # which is a lie told to every resolver that reads it.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    # CPython only, deliberately. PyPy is NOT claimed: SQLiteBackend does not work there.
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# Every bound below was measured by resolving it at its exact minimum, not guessed. See
# tests/test_packaging.py::TestDependencyFloors, which does exactly that on every run.
dependencies = [
    # 2.0.2, not 2.0.0: every FastAPI release that supports pydantic v2 explicitly
    # excludes 2.0.0 and 2.0.1, so `signledger[fastapi]` had no solution at all. The
    # floor moves here rather than on fastapi because no FastAPI release accepts them.
    "pydantic>=2.0.2",
    # `typing-extensions` was a hard dependency that no shipped module imports
    # (`grep -rn typing_extensions signledger/` finds nothing) AND that no version of
    # could satisfy: the declared `>=4.0.0` floor is unsatisfiable against our own
    # pydantic floor, which requires typing-extensions>=4.6.1. Removed, not raised.
]

[project.optional-dependencies]
signatures = ["cryptography>=41.0.0"]
# 3.2.4, not 3.1: psycopg-binary published no macOS arm64 wheel until 3.2.4 (3.1.x and
# 3.2.1-3.2.3 are Linux/Windows/macOS-x86_64 only) and nothing below 3.2 has a cp314
# wheel. `>=3.1` resolved on Linux CI and nowhere else, which is why it survived.
# 3.2.0 is skipped for a second, unrelated reason: its `binary` extra depends on a
# `psycopg-binary==3.2.0.dev1` that was never published.
postgresql = ["psycopg[binary]>=3.2.4"]
# 4.3.2 is the first pymongo with a macOS arm64 wheel (measured: 4.0.0 through 4.3.0 are
# source-only there). Below it, pip compiles the `_cmessage` C extension from source:
# that needs a toolchain and Python headers the target may not have (slim containers,
# Windows), and where it does succeed the user silently runs different code from everyone
# on a wheel. `>=4.0.0` was not *unsatisfiable* - a quieter defect than the others here -
# but the fix is free, since nothing in backends/mongodb.py uses an API added after 4.0.
# 4.3.3 rather than 4.3.2 only because it is the release the integration was verified on.
mongodb = ["pymongo>=4.3.3"]
# 2.3.3, not 2.0.0, and this one does NOT show up in a resolver. flask 2.0-2.2 declare
# `Werkzeug>=2.0` with no upper bound, so a fresh resolve pairs them with Werkzeug 3 and
# `import flask` dies on `url_quote` before signledger is ever reached. Bisected across
# eight releases: 2.0.0/2.1.0/2.2.0/2.2.2 fail on that ImportError; 2.2.5/2.3.0 import
# but crash in the test client on `werkzeug.__version__`; 2.3.3 is the first that
# fresh-resolves to a fully working stack (51/51 contrib tests pass, 44 fail on 2.3.0).
flask = ["flask>=2.3.3"]
fastapi = ["fastapi>=0.100.0"]
django = ["django>=4.2"]
# Must stay the exact union of the six extras above; a copy drifts, so a test compares
# them (TestDependencyFloors::test_the_all_extra_is_exactly_the_union_of_the_runtime_extras).
all = [
    "cryptography>=41.0.0",
    "django>=4.2",
    "fastapi>=0.100.0",
    "flask>=2.3.3",
    "psycopg[binary]>=3.2.4",
    "pymongo>=4.3.3",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "hypothesis>=6.80.0",
    # Nothing in this project imports httpx; it is here because `starlette.testclient`
    # needs it. 0.26.0, not 0.24.0: 0.24/0.25 cap `httpcore<0.18`, which cannot coexist
    # with the `httpcore2` that httpx2 requires, so the two floors below were mutually
    # unsatisfiable on every Python where both apply.
    "httpx>=0.26.0",
    # starlette 1.3 deprecates using `httpx` with `starlette.testclient` and wants
    # `httpx2`. Under `filterwarnings = ["error"]` that deprecation is raised at import,
    # so `fastapi.testclient` explodes and tests/test_contrib_fastapi.py collected ZERO
    # tests against a fresh resolve of the fastapi extra. The marker is required, not
    # cosmetic: httpx2 itself requires Python >= 3.10, and on 3.9 the fastapi extra
    # resolves to starlette 0.49, which still wants plain httpx.
    'httpx2>=2.9; python_version >= "3.10"',
]
dev = [
    "mutmut>=2.4.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "bandit>=1.7.5",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/0xV8/signledger"
Source = "https://github.com/0xV8/signledger"
"Bug Reports" = "https://github.com/0xV8/signledger/issues"
Changelog = "https://github.com/0xV8/signledger/blob/main/CHANGELOG.md"

[project.scripts]
signledger = "signledger.cli:main"

# Explicit package list. NEVER find_packages(): that is how v1.0.0 shipped four empty
# directories that shadowed their own sibling modules and broke the console script.
[tool.setuptools]
packages = [
    "signledger",
    "signledger.core",
    "signledger.crypto",
    "signledger.backends",
    "signledger.anchor",
    "signledger.contrib",
    "signledger.contrib.django",
    "signledger.contrib.django.migrations",
]
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "signledger.__version__" }

[tool.setuptools.package-data]
signledger = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
timeout = 300
markers = [
    "postgres: requires a live PostgreSQL server",
    "mongo: requires a live MongoDB server",
    "slow: long-running (concurrency/stress)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["signledger"]
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    "class .*\\(Protocol\\):",
    "\\.\\.\\.",
]

[tool.mypy]
# The package still *supports* 3.9 (see requires-python and the UP006 note above), but
# mypy >= 1.15 refuses to type-check against it: "Python 3.9 is not supported (must be
# 3.10 or higher)". 3.10 is the lowest version the checker will accept, so it is the
# floor we can actually verify. Runtime compatibility with 3.9 is covered by the ruff
# target-version and by not using any 3.10+ syntax.
python_version = "3.10"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "RET", "SIM"]
ignore = [
    "S101",
    # UP006/UP035 demand PEP 585 (`dict[str, Any]`, `collections.abc.Iterator`).
    # Architecture contract section 10 mandates `typing.Dict` and explicitly forbids
    # PEP 585 for this package. Both rules fired ~410 times across every module, and
    # six separate implementation waves reported the conflict rather than silently
    # picking a side. Resolved here, in the one place a project-wide style decision
    # belongs: the contract wins, so the two rules are off.
    #
    # (PEP 585 is in fact valid on the 3.9 floor, so this is a consistency decision
    # rather than a compatibility one. If section 10 is ever relaxed, delete these two
    # entries and run `ruff check --fix --unsafe-fixes`.)
    "UP006",
    "UP035",
    # SIM117 wants nested `with` blocks merged. Merging the three-context cases here
    # exceeds line-length, and the parenthesized form that would wrap them is documented
    # as 3.10+ (3.9's PEG parser accepted it only as an undocumented side effect). The
    # package floor is 3.9, so the nested form is the only guaranteed-valid spelling.
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N806"]

[tool.mutmut]
# LISTS, not strings. mutmut 3.x concatenates these onto its own argument lists, so a
# bare string raises `TypeError: can only concatenate list (not "str") to list` while the
# config is still loading - before a single mutant is generated. `mutmut run` therefore
# could not start on this repository at all, and the CI job reported success anyway
# because it ended in `|| true`. A green check over a command that never ran is the exact
# failure this project was rebuilt to remove.
#
# `tests_dir` is itself deprecated in 3.x and warns; the selection now goes where mutmut
# asks for it.
source_paths = ["signledger/"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.bandit]
# Run as: bandit -c pyproject.toml -r signledger
#
# Both suppressions below are justified by a control that is itself tested. Neither is a
# blanket "bandit is noisy" dismissal, and both should be re-examined if the control moves.
#
# B101 (assert_used) - 72 hits, all inside BackendConformanceSuite in backends/base.py.
#   That class is a test harness that ships as library code so third-party backends can
#   prove they are interchangeable, and `assert` is the right spelling there. The real risk
#   bandit is pointing at is that `python -O` strips asserts, which would make the suite
#   pass without testing anything - so the suite now refuses to run with assertions
#   disabled (`_require_assertions`), pinned by
#   tests/test_backend_conformance.py::TestTheSuiteRefusesToRunWithAssertionsDisabled.
#   There are no asserts anywhere else in the package; if that changes, this skip is wrong.
#
# B608 (hardcoded_sql_expressions) - 7 hits in backends/sqlite.py. SQL has no parameter
#   binding for an identifier, so a table name must be interpolated. Every one of those
#   names passes through `validate_identifier`, which allowlists against a regex and
#   refuses anything carrying a quote, semicolon, space or comment marker. Ruff enforces
#   the same rule as S608 with a per-site `# noqa` carrying that justification; bandit does
#   not read noqa comments, which is the only reason this appears here.
skips = ["B101", "B608"]
exclude_dirs = ["tests", "signledger/contrib/django/migrations"]
